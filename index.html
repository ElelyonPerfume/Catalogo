*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ivory);font-family:var(--sans);line-height:1.5}
.sr{position:absolute;left:-9999px}
header{padding:22px 16px 6px;text-align:center}
.logo{width:min(340px,80%);height:auto;-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,#000 60%,transparent 100%)}
.motto{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--cap);color:var(--gold);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;margin-top:-6px}
.motto:before,.motto:after{content:"";height:1px;width:clamp(20px,8vw,70px);background:var(--gold);opacity:.6}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.tab,.btn,.bar input,.bar select{font:inherit;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ivory);padding:8px 18px;cursor:pointer}
.tab{font-family:var(--cap);letter-spacing:.1em;font-size:.9rem;flex:1 1 0;max-width:170px}
.bar select{cursor:pointer;flex:1 1 140px;max-width:230px;color-scheme:dark}
[aria-pressed=true]{background:linear-gradient(#f0d58e,#c8a15a);color:#1a1405;border-color:var(--gold);font-weight:500}
.bar input{cursor:text;flex:2 1 160px;max-width:340px;min-width:0}
.bar input::placeholder{color:var(--mut)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:16px 14px 30px}
.count{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cw{display:flex;flex-direction:column;gap:6px}
.card{all:unset;box-sizing:border-box;cursor:pointer;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold)}
.card:focus-visible{outline:2px solid var(--gold2)}
.ph,.card img,.modal img{aspect-ratio:3/4;width:100%;object-fit:cover;display:block}
.ph{background:#000 var(--lion) center/55% no-repeat}
.card span{padding:10px 12px 0;font-weight:500;line-height:1.25}
.card small{padding:2px 12px 10px;color:var(--gold);font-family:var(--cap);font-size:.7rem;letter-spacing:.08em}
.card span:last-child{padding-bottom:10px}
.ad{display:flex;gap:6px}.ad button{flex:1;font:inherit;font-size:.8rem;padding:5px;border-radius:6px;border:1px solid var(--line);background:#1a1712;color:var(--ivory);cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.modal{background:var(--panel);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;border:1px solid var(--line);position:relative;display:grid;grid-template-columns:1fr;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
.modal img,.modal .ph{height:260px;aspect-ratio:auto}
.info{padding:20px 20px 26px}
.info h2{font-family:var(--script);font-weight:400;font-size:2.5rem;line-height:1.1;color:var(--gold2)}
.sub{color:var(--gold);font-family:var(--cap);font-size:.8rem;letter-spacing:.1em;margin:2px 0 14px}
dl{display:grid;gap:12px}dt{color:var(--gold);font-size:.85rem}dd.todo{color:var(--mut);font-style:italic}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(6,6,6,.9);color:var(--ivory);font-size:1.3rem;cursor:pointer;z-index:2}
.wa{display:inline-block;margin-top:18px;background:linear-gradient(#f0d58e,#c8a15a);color:#1a1405;text-decoration:none;font-weight:500;padding:11px 22px;border-radius:999px}
.frm{display:grid;gap:10px;margin-top:10px}.frm label{display:grid;gap:3px;color:var(--gold);font-size:.85rem}
.frm input,.frm select,.frm textarea,#io,#pin{font:inherit;background:#0b0a09;color:var(--ivory);border:1px solid var(--line);border-radius:6px;padding:8px}
.btn{background:linear-gradient(#f0d58e,#c8a15a);color:#1a1405;border-color:var(--gold)}.btn.ghost{background:var(--panel);color:var(--ivory);border-color:var(--line)}
.adm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;border:1px dashed var(--gold);border-radius:8px;margin-bottom:14px}
.adm .btn{padding:6px 14px;font-size:.85rem}#io{width:100%;height:110px;margin-top:6px}
footer{display:flex;flex-direction:column;align-items:flex-end;padding:10px 8px 18px}
#lock{width:44px;height:44px;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lock i{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.3}
#login{align-self:stretch;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
@media(min-width:700px){
.ov{align-items:center;padding:20px}
.modal{grid-template-columns:300px 1fr;border-radius:14px}
.modal.one{grid-template-columns:1fr}
.modal img,.modal .ph{height:100%;min-height:420px}}
</style>

"Acqua di Gio":["Acuática cítrica","Limón, lima, bergamota, mandarina","Jazmín, romero, notas marinas","Almizcle, cedro, musgo de roble","Frescura marina, limpieza y calma","Oficina, gimnasio, uso diario","Primavera y verano","Discreta y agradable; buena primera fragancia."],
"La Vida es Bella":["Floral gourmand","Pera, grosella negra","Iris, jazmín, flor de azahar","Praliné, vainilla, pachulí","Alegría, dulzura y feminidad","Uso diario, citas, celebraciones","Otoño e invierno","Aplícala en muñecas y detrás de las orejas."],
"Good Girl":["Floral oriental","Almendra, café, bergamota","Tuberosa, jazmín sambac","Haba tonka, cacao, vainilla","Seducción y misterio con carácter","Noche, citas, eventos","Otoño e invierno","Fragancia intensa: 2 o 3 pulverizaciones bastan."]
};
const LABELS = ["Familia olfativa","Notas de salida","Notas de corazón","Notas de fondo","Qué transmite","Ocasiones de uso","Estación","Consejo"];

/* ====== 5. GRUPOS (primera clasificación, editable desde el panel admin) ====== */
const GROUPS_DEF = {
"Juveniles":`212,212 Vip,212 Vip Black,360,360 Red,9am,9pm,Bad Boy,Toy Boy,Happy Clinique,Instant Crush,Invictus,Invictus Acqua,Invictus Platinum,One Million,Her Loss,Cloud Ariana Grande,Thank U Next,Toy 2 Bubble Gum,Selena Gomez,Poison Girl,Touch of Pink,Yara Candy,Idol,Good Girl,Good Girl Glam,Sofía Vergara,París Hilton,Halloween Shot,212 Sexy,212 VIP Rose,212 Héroes,360 Coral,Bitter Peach,9pm Woman,Yara,Yara Moi,Yara Tous`,
"Clásicas":`Drakkar,Farenheit,Polo Green,Polo Sport,Eternity,Azzaro,Paco Rabane,Lapidus,Swiss Army,Hugo Man,Hugo Red,A Men,Halloween Man,Angel de Mugler,Anais Anais,Chanel No.5,Chance Chanel,Coco Chanel,Coco Mademoiselle,Angel,Amarige Givenchy,J'adore,Elizabeth Arden,Flower by Kenzo,Tribu,Paloma Picasso,Ralph Lauren,Halloween,Lolita Lempicka,Diesel,Diésel,Burberry Her,Carolina Herrera,CH`,
"Modernas":`Sauvage,Sauvage Elixir,Bleu de Chanel,Le Beau,Le Male,Le Male Elixir,Le Male Le Parfum,Stronger With You,Y,Phantom,Ombre Leather,Spice Bomb,Scandal,Luna Rosa,Eros,Eros Energy,Eros Flame,Azzaro Most Wanted,Azzaro Chrome,Dior Homme Intense,Acqua di Gio Profondo,Acqua di Gio Profumo,Invictus Victory,God of Fire,Armani Code,Valentino Born in Roma Coral Fantasy,Valentino Born in Roma Intense,Valentino Born in Roma Uomo,Tommy Impact Tobacco Vainilla,La Vida es Bella,La Vida es Bella Elixir,Libre ISL,Olympea,Si,My Way,Miss Dior,La Belle,La Nuit Tresor,Valentino Donna,Lady Million,Black Opium,Bombshell Victoria Secret,Vanilla Lace Victoria Secret,Bright Cristal,Noble Rush`,
"Árabes y nicho":`Asad,Asad Bourbon,Althair,Hawas,Hawas Ice,Khamrah,Club de Nuit,Bharara Chocolate,Bharara King,Bharara Niche,Bharara Queen,Arabians Tonka,Alexandria II,Layton,Aventus,Santal 33,Baccarat,Amber Oud,Amber Rouge,Lira Xerjoff,Oud Maracuya,Ombre Nomade,Erba Pura,Paradise Garden,Bianco Latte,Naxos,Noir Extreme,Q`,
"Frescas":`Acqua di Gio,Cool Water,Light Blue,Dark Blue,Náutica,Náutica Voyage,Polo Blue,Polo Black,Polo 67,Polo Red,Lacoste Blanc,Lacoste Esential,Lacoste Red,Mega Mare,Silver Blue,Silver Mountain,Mandarino di Amalfi,Mandarin Sky,Odyssey Limoni,Odyssey Chocolate,Limensite,Summer Hammer,Puré XS,XS,The One,Myself,L'homme,Imagination`
};

/* ====== 6. ADMIN Y PUBLICACIÓN ======
PIN: cambia el valor. OJO: al ser una página estática, el PIN es una barrera ligera, no seguridad real.
PUBLISHED: para que TODOS vean tus cambios, pulsa Exportar en el panel admin y pega el texto aquí (entre los corchetes). */
const PIN = "2403";
const PUBLISHED = null;
const KEY = "elelyon_catalogo_v1";

/* ====== LÓGICA ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const gmap = {}; for (const g in GROUPS_DEF) GROUPS_DEF[g].split(",").forEach(n => gmap[n] = g);
let uid = 0;
const DEFAULTS = ["M","W"].flatMap(c => LISTS[c].map(n => ({id:"i"+(uid++), n, c, g:gmap[n]||"", img:IMG[n]||"", d:D[c+":"+n]||D[n]||[]})));
let items; try { items = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!Array.isArray(items)) items = clone(PUBLISHED || DEFAULTS);
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) {} };
let cat = "M", grp = "", term = "", admin = false;
const media = x => x.img ? `<img src="${esc(x.img)}" alt="${esc(x.n)}" loading="lazy">` : `<div class="ph" aria-hidden="true"></div>`;
const show = () => $("ov").classList.add("on");
const close = () => $("ov").classList.remove("on");
function sure(b, fn){ if (b.dataset.s) return fn(); b.dataset.s = 1; const t = b.textContent; b.textContent = "¿Seguro?"; setTimeout(() => { delete b.dataset.s; b.textContent = t; }, 3000); }

function render(){
  const gs = [...new Set(items.filter(x => x.c === cat && x.g).map(x => x.g))];
  if (grp && !gs.includes(grp)) grp = "";
  $("grp").innerHTML = `<option value="">Todos los grupos</option>` + gs.map(g => `<option value="${esc(g)}"${g === grp ? " selected" : ""}>${esc(g)}</option>`).join("");
  const l = items.filter(x => x.c === cat && (!grp || x.g === grp) && norm(x.n).includes(norm(term)));
  $("count").textContent = l.length + " fragancias";
  $("grid").innerHTML = l.length ? l.map(x => `<div class="cw"><button class="card" data-id="${x.id}">${media(x)}<span>${esc(x.n)}</span>${x.g ? `<small>${esc(x.g)}</small>` : ""}</button>${admin ? `<div class="ad"><button data-a="e" data-id="${x.id}">Editar</button><button data-a="d" data-id="${x.id}">Eliminar</button></div>` : ""}</div>`).join("")
    : `<p class="empty">No encontramos esa fragancia. Prueba con otra palabra.</p>`;
  $("adm").hidden = !admin;
}

function open(id){
  const x = items.find(i => i.id === id); if (!x) return;
  const rows = LABELS.map((l,k) => x.d[k] ? `<div><dt>${l}</dt><dd>${esc(x.d[k])}</dd></div>` : `<div><dt>${l}</dt><dd class="todo">Por completar</dd></div>`).join("");
  const msg = encodeURIComponent("Hola, me interesa la fragancia " + x.n);
  $("modal").className = "modal";
  $("modal").innerHTML = `<button class="x" aria-label="Cerrar">×</button>${media(x)}<div class="info"><h2>${esc(x.n)}</h2><p class="sub">${x.c === "M" ? "Caballeros" : "Damas"}${x.g ? " — " + esc(x.g) : ""}</p><dl>${rows}</dl>${WA ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${msg}">Pedir por WhatsApp</a>` : ""}</div>`;
  show(); $("modal").querySelector(".x").focus();
}

function form(id){
  const x = items.find(i => i.id === id) || {n:"", c:cat, g:grp, img:"", d:[]};
  $("modal").className = "modal one";
  $("modal").innerHTML = `<button class="x" aria-label="Cerrar">×</button><div class="info"><h2>${id ? "Editar" : "Nueva"} fragancia</h2><div class="frm">
  <label>Nombre<input id="f_n" value="${esc(x.n)}"></label>
  <label>Categoría<select id="f_c"><option value="M">Caballeros</option><option value="W">Damas</option></select></label>
  <label>Grupo (elige uno o escribe uno nuevo)<input id="f_g" list="gl" value="${esc(x.g)}"></label>
  <datalist id="gl">${[...new Set(items.map(i => i.g).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join("")}</datalist>
  <label>URL de la foto<input id="f_i" value="${esc(x.img)}"></label>
  ${LABELS.map((l,k) => `<label>${l}<textarea id="f_${k}" rows="2">${esc(x.d[k] || "")}</textarea></label>`).join("")}
  <div><button class="btn" id="sv" data-id="${id || ""}">Guardar</button> <button class="btn ghost" id="cn">Cancelar</button></div></div></div>`;
  $("f_c").value = x.c; show();
}

function saveForm(id){
  const n = $("f_n").value.trim(); if (!n) return $("f_n").focus();
  const o = {n, c:$("f_c").value, g:$("f_g").value.trim(), img:$("f_i").value.trim(), d:LABELS.map((_,k) => $("f_"+k).value.trim())};
  if (!o.d.some(Boolean)) o.d = [];
  if (id) Object.assign(items.find(i => i.id === id), o); else items.push({id:"n"+Date.now(), ...o});
  persist(); cat = o.c; close(); render();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { cat = b.dataset.c; grp = ""; document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", t === b)); render(); });
$("grp").onchange = e => { grp = e.target.value; render(); };
$("q").oninput = e => { term = e.target.value; render(); };
$("grid").onclick = e => {
  const a = e.target.closest("[data-a]"), c = e.target.closest(".card");
  if (a) { if (a.dataset.a === "e") form(a.dataset.id); else sure(a, () => { items = items.filter(i => i.id !== a.dataset.id); persist(); render(); }); }
  else if (c) open(c.dataset.id);
};
$("ov").onclick = e => { if (e.target.id === "ov" || e.target.closest(".x") || e.target.id === "cn") close(); else if (e.target.id === "sv") saveForm(e.target.dataset.id); };
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

$("lock").onclick = () => { if (!admin) { $("login").hidden = false; $("pin").focus(); } };
$("go").onclick = () => { if ($("pin").value === PIN) { admin = true; $("login").hidden = true; $("pin").value = ""; $("err").textContent = ""; render(); } else $("err").textContent = "PIN incorrecto"; };
$("pin").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("new").onclick = () => form("");
$("out").onclick = () => { admin = false; render(); };
$("exp").onclick = () => { $("io").value = JSON.stringify(items); $("io").select(); };
$("app").onclick = b => { try { const v = JSON.parse($("io").value); if (!Array.isArray(v)) throw 0; items = v; persist(); render(); $("io").value = ""; } catch(e) { $("io").value = "Texto no válido. Pega aquí el texto exportado completo."; } };
$("rst").onclick = e => sure(e.currentTarget, () => { try { localStorage.removeItem(KEY); } catch(x) {} items = clone(PUBLISHED || DEFAULTS); render(); });
render();
</script>
</body>
</html>
